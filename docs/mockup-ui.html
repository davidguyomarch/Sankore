<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open-Sankoré UI Mockup — Target Interface</title>
<!-- Phosphor Icons -->
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root {
    --bg: #1e1e2e;
    --surface: #2b2b3d;
    --surface-hover: #363650;
    --border: #3d3d5c;
    --primary: #5b8def;
    --primary-hover: #7aa3f5;
    --on-primary: #ffffff;
    --on-surface: #e0e0e0;
    --on-surface-dim: #a0a0b0;
    --canvas-bg: #f5f5f5;
    --danger: #e55050;
    --success: #50c878;
    --radius: 8px;
    --toolbar-h: 48px;
    --sidebar-w: 200px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--on-surface); height: 100vh; overflow: hidden; }

/* Layout */
.app { display: grid; grid-template-rows: var(--toolbar-h) 1fr var(--toolbar-h); grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }
.top-bar { grid-column: 1 / -1; }
.sidebar { grid-row: 2; overflow-y: auto; }
.canvas-area { grid-row: 2; }
.bottom-bar { grid-column: 1 / -1; }

/* Top Toolbar */
.top-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 4px;
}
.top-bar .separator { width: 1px; height: 28px; background: var(--border); margin: 0 8px; }
.top-bar .spacer { flex: 1; }
.top-bar .mode-tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 6px; padding: 2px; }
.mode-tab { padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--on-surface-dim); border: none; background: none; display: flex; align-items: center; gap: 6px; }
.mode-tab.active { background: var(--primary); color: var(--on-primary); }
.mode-tab:hover:not(.active) { background: var(--surface-hover); color: var(--on-surface); }
.mode-tab i { font-size: 16px; }

/* Buttons */
.btn { width: 36px; height: 36px; border-radius: var(--radius); border: none; background: transparent; color: var(--on-surface); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; transition: all 0.15s; }
.btn:hover { background: var(--surface-hover); }
.btn.active { background: var(--primary); color: var(--on-primary); }
.btn-group { display: flex; gap: 2px; }

/* Sidebar */
.sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
}
.sidebar-header { padding: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--on-surface-dim); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
.sidebar-header i { font-size: 14px; }
.page-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.page-thumb { background: white; border-radius: 4px; aspect-ratio: 16/9; border: 2px solid transparent; cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.15s; }
.page-thumb.active { border-color: var(--primary); }
.page-thumb:hover:not(.active) { border-color: var(--on-surface-dim); }
.page-thumb .num { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: #666; background: rgba(255,255,255,0.8); padding: 0 4px; border-radius: 2px; }
.sidebar-footer { padding: 8px; border-top: 1px solid var(--border); display: flex; gap: 4px; justify-content: center; }

/* Canvas */
.canvas-area {
    background: #3a3a4a;
    display: flex; align-items: center; justify-content: center;
    position: relative;
}
.canvas {
    background: var(--canvas-bg);
    width: 88%; height: 88%;
    border-radius: 2px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    position: relative;
}
.canvas-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #bbb; font-size: 13px; }

/* Bottom Toolbar (Stylus) */
.bottom-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 12px;
}
.tool-btn { width: 40px; height: 40px; border-radius: var(--radius); border: none; background: transparent; color: var(--on-surface); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: all 0.15s; position: relative; }
.tool-btn:hover { background: var(--surface-hover); }
.tool-btn.active { background: var(--primary); color: var(--on-primary); }
.tool-separator { width: 1px; height: 28px; background: var(--border); margin: 0 6px; }

/* Drawing Properties Bar */
.props-bar {
    position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 6px 14px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.color-swatch { width: 26px; height: 26px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
.color-swatch.active { border-color: var(--on-primary); box-shadow: 0 0 0 2px var(--primary); }
.color-swatch:hover { transform: scale(1.15); }
.props-sep { width: 1px; height: 24px; background: var(--border); }
.width-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; border: none; background: transparent; transition: all 0.15s; }
.width-btn:hover { background: var(--surface-hover); }
.width-btn.active { background: var(--primary); }
.width-btn .dot { background: var(--on-surface); border-radius: 50%; }
.width-btn.active .dot { background: var(--on-primary); }

/* Floating palette (shapes) */
.shapes-palette {
    position: absolute; left: calc(var(--sidebar-w) + 20px); bottom: 70px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; display: grid; grid-template-columns: repeat(3, 42px); gap: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
}
.shapes-palette .section-label { grid-column: 1 / -1; font-size: 10px; text-transform: uppercase; color: var(--on-surface-dim); padding: 4px 2px 2px; letter-spacing: 0.3px; }
.shape-btn { width: 42px; height: 42px; border-radius: 6px; border: none; background: transparent; color: var(--on-surface); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.15s; }
.shape-btn:hover { background: var(--surface-hover); }
.shape-btn.active { background: var(--primary); color: var(--on-primary); }

/* Tooltip */
[data-tooltip] { position: relative; }
[data-tooltip]:hover::after { content: attr(data-tooltip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #111; color: #eee; padding: 4px 10px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 100; pointer-events: none; }
.bottom-bar [data-tooltip]:hover::after { bottom: auto; top: calc(100% + 8px); }
</style>
</head>
<body>

<div class="app">

<!-- ═══ TOP TOOLBAR ═══ -->
<div class="top-bar">
    <!-- Mode tabs -->
    <div class="mode-tabs">
        <button class="mode-tab active"><i class="ph ph-chalkboard-teacher"></i> Tableau</button>
        <button class="mode-tab"><i class="ph ph-folders"></i> Documents</button>
        <button class="mode-tab"><i class="ph ph-desktop"></i> Bureau</button>
    </div>

    <div class="separator"></div>

    <!-- Undo/Redo -->
    <div class="btn-group">
        <button class="btn" data-tooltip="Annuler (Ctrl+Z)"><i class="ph ph-arrow-counter-clockwise"></i></button>
        <button class="btn" data-tooltip="Refaire (Ctrl+Y)"><i class="ph ph-arrow-clockwise"></i></button>
    </div>

    <div class="separator"></div>

    <!-- Page navigation -->
    <div class="btn-group">
        <button class="btn" data-tooltip="Page précédente"><i class="ph ph-caret-left"></i></button>
        <span style="font-size:12px;color:var(--on-surface-dim);padding:0 8px;line-height:36px;">3 / 12</span>
        <button class="btn" data-tooltip="Page suivante"><i class="ph ph-caret-right"></i></button>
        <button class="btn" data-tooltip="Nouvelle page"><i class="ph ph-plus"></i></button>
        <button class="btn" data-tooltip="Dupliquer la page"><i class="ph ph-copy"></i></button>
        <button class="btn" data-tooltip="Supprimer la page"><i class="ph ph-trash"></i></button>
    </div>

    <div class="separator"></div>

    <!-- Background -->
    <div class="btn-group">
        <button class="btn active" data-tooltip="Fond clair"><i class="ph ph-sun"></i></button>
        <button class="btn" data-tooltip="Fond sombre"><i class="ph ph-moon"></i></button>
        <button class="btn" data-tooltip="Quadrillage"><i class="ph ph-grid-four"></i></button>
    </div>

    <div class="spacer"></div>

    <!-- Right actions -->
    <div class="btn-group">
        <button class="btn" data-tooltip="Plein écran"><i class="ph ph-corners-out"></i></button>
        <button class="btn" data-tooltip="Multi-écran"><i class="ph ph-monitor"></i></button>
        <button class="btn" data-tooltip="Préférences"><i class="ph ph-gear"></i></button>
        <button class="btn" data-tooltip="Menu"><i class="ph ph-list"></i></button>
    </div>
</div>

<!-- ═══ SIDEBAR (Page Navigator) ═══ -->
<div class="sidebar">
    <div class="sidebar-header"><i class="ph ph-stack"></i> Pages</div>
    <div class="page-list">
        <div class="page-thumb"><span class="num">1</span></div>
        <div class="page-thumb"><span class="num">2</span></div>
        <div class="page-thumb active"><span class="num">3</span></div>
        <div class="page-thumb"><span class="num">4</span></div>
        <div class="page-thumb"><span class="num">5</span></div>
        <div class="page-thumb"><span class="num">6</span></div>
        <div class="page-thumb"><span class="num">7</span></div>
        <div class="page-thumb"><span class="num">8</span></div>
    </div>
    <div class="sidebar-footer">
        <button class="btn" data-tooltip="Ajouter page"><i class="ph ph-plus-circle"></i></button>
        <button class="btn" data-tooltip="Importer fichier"><i class="ph ph-upload-simple"></i></button>
        <button class="btn" data-tooltip="Bibliothèque"><i class="ph ph-books"></i></button>
    </div>
</div>

<!-- ═══ CANVAS ═══ -->
<div class="canvas-area">
    <div class="canvas">
        <span class="canvas-hint">Zone de dessin — QGraphicsView (C++)</span>
    </div>

    <!-- Floating: Drawing Properties -->
    <div class="props-bar">
        <div class="color-swatch active" style="background:#1a1a1a;"></div>
        <div class="color-swatch" style="background:#e53935;"></div>
        <div class="color-swatch" style="background:#1565c0;"></div>
        <div class="color-swatch" style="background:#2e7d32;"></div>
        <div class="props-sep"></div>
        <div class="width-btn active"><div class="dot" style="width:4px;height:4px;"></div></div>
        <div class="width-btn"><div class="dot" style="width:8px;height:8px;"></div></div>
        <div class="width-btn"><div class="dot" style="width:12px;height:12px;"></div></div>
    </div>

    <!-- Floating: Shapes Palette -->
    <div class="shapes-palette" style="display:none;" id="shapesPalette">
        <div class="section-label">Formes</div>
        <button class="shape-btn active" data-tooltip="Ellipse"><i class="ph ph-circle"></i></button>
        <button class="shape-btn" data-tooltip="Rectangle"><i class="ph ph-rectangle"></i></button>
        <button class="shape-btn" data-tooltip="Triangle"><i class="ph ph-triangle"></i></button>
        <button class="shape-btn" data-tooltip="Losange"><i class="ph ph-diamond"></i></button>
        <button class="shape-btn" data-tooltip="Polygone"><i class="ph ph-hexagon"></i></button>
        <button class="shape-btn" data-tooltip="Étoile"><i class="ph ph-star"></i></button>
        <div class="section-label">Propriétés</div>
        <button class="shape-btn" data-tooltip="Remplissage"><i class="ph ph-paint-bucket"></i></button>
        <button class="shape-btn" data-tooltip="Contour"><i class="ph ph-pencil-line"></i></button>
        <button class="shape-btn" data-tooltip="Aligner"><i class="ph ph-align-center-horizontal"></i></button>
    </div>
</div>

<!-- ═══ BOTTOM TOOLBAR (Stylus Tools) ═══ -->
<div class="bottom-bar">
    <!-- Drawing palette toggle -->
    <button class="tool-btn" data-tooltip="Formes" id="btnShapes" onclick="toggleShapes()"><i class="ph ph-shapes"></i></button>
    <div class="tool-separator"></div>

    <!-- Drawing tools -->
    <button class="tool-btn active" data-tooltip="Stylo" onclick="selectTool(this)"><i class="ph ph-pen"></i></button>
    <button class="tool-btn" data-tooltip="Gomme" onclick="selectTool(this)"><i class="ph ph-eraser"></i></button>
    <button class="tool-btn" data-tooltip="Marqueur" onclick="selectTool(this)"><i class="ph ph-highlighter-circle"></i></button>
    <button class="tool-btn" data-tooltip="Sélection" onclick="selectTool(this)"><i class="ph ph-cursor"></i></button>

    <div class="tool-separator"></div>

    <!-- Navigation tools -->
    <button class="tool-btn" data-tooltip="Lecture" onclick="selectTool(this)"><i class="ph ph-play"></i></button>
    <button class="tool-btn" data-tooltip="Main" onclick="selectTool(this)"><i class="ph ph-hand"></i></button>
    <button class="tool-btn" data-tooltip="Zoom +" onclick="selectTool(this)"><i class="ph ph-magnifying-glass-plus"></i></button>
    <button class="tool-btn" data-tooltip="Zoom -" onclick="selectTool(this)"><i class="ph ph-magnifying-glass-minus"></i></button>
    <button class="tool-btn" data-tooltip="Pointeur laser" onclick="selectTool(this)"><i class="ph ph-crosshair"></i></button>

    <div class="tool-separator"></div>

    <!-- Creation tools -->
    <button class="tool-btn" data-tooltip="Ligne" onclick="selectTool(this)"><i class="ph ph-line-segment"></i></button>
    <button class="tool-btn" data-tooltip="Texte" onclick="selectTool(this)"><i class="ph ph-text-t"></i></button>
    <button class="tool-btn" data-tooltip="Capture" onclick="selectTool(this)"><i class="ph ph-selection"></i></button>
    <button class="tool-btn" data-tooltip="OCR" onclick="selectTool(this)"><i class="ph ph-text-aa"></i></button>
</div>

</div>

<script>
function selectTool(el) {
    document.querySelectorAll('.bottom-bar .tool-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}
function toggleShapes() {
    const p = document.getElementById('shapesPalette');
    const btn = document.getElementById('btnShapes');
    const shown = p.style.display !== 'none';
    p.style.display = shown ? 'none' : 'grid';
    btn.classList.toggle('active', !shown);
}
</script>

</body>
</html>
