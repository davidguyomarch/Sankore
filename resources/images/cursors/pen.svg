<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Pen cursor: tip at bottom-left (4,28), body angled 45° -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pen body (dark with white outline for visibility on any background) -->
    <path d="M4 28 L24 8 L28 12 L8 32 Z" fill="#333333" stroke="white" stroke-width="1.5"/>
    <!-- Pen tip -->
    <path d="M4 28 L2 30" stroke="#333333" stroke-width="2"/>
    <!-- Highlight line on pen body -->
    <line x1="10" y1="22" x2="22" y2="10" stroke="white" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Dot at tip for precision -->
  <circle cx="3" cy="29" r="1.5" fill="white" stroke="#333333" stroke-width="0.5"/>
</svg>
