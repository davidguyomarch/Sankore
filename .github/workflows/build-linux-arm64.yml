name: Build Linux ARM64

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 hosted runner (GA since Aug 2025, free/unlimited on public repos).
    # Replaces the previous QEMU-emulated arm64v8/ubuntu:22.04 container, which
    # intermittently segfaulted during apt-get under emulation (see #220).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev libqt6svg6-dev \
            qt6-multimedia-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-l10n-tools \
            libqt6opengl6-dev libqt6core5compat6-dev \
            libgl1-mesa-dev libssl-dev zlib1g-dev \
            libx11-dev libomp-dev pkg-config \
            libpulse-dev libzinnia-dev \
            gdb dpkg-dev rpm \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qt5compat-graphicaleffects \
            qml6-module-qtqml-workerscript \
            xvfb

      - name: Build QuaZip from source
        run: |
          git clone --depth 1 --branch v1.4 https://github.com/stachenov/quazip.git /tmp/quazip-src
          cmake -S /tmp/quazip-src -B /tmp/quazip-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DBUILD_SHARED_LIBS=ON \
            -DQUAZIP_BZIP2=OFF
          cmake --build /tmp/quazip-build -j$(nproc)
          sudo cmake --install /tmp/quazip-build
          sudo ldconfig || true

      - name: Generate git version header and set version
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "#define GIT_COMMIT \"$(git rev-parse --short HEAD)\"" > src/core/git_version.h
          echo "#define GIT_VERSION \"$(git describe --tags --always)\"" >> src/core/git_version.h
          cat src/core/git_version.h
          # The git tag is the single source of truth. On a tag push (or dispatch
          # on a tag) GITHUB_REF_NAME is the tag name (v4.3.0), reliable under a
          # shallow clone unlike `git describe`. Fall back to .pro (dev build).
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJ="${BASH_REMATCH[1]}"; MIN="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
            echo "Updating version to $MAJ.$MIN.$PATCH from tag $REF_NAME"
            sed -i "s/VERSION_MAJ = .*/VERSION_MAJ = $MAJ/" OpenSankore.pro
            sed -i "s/VERSION_MIN = .*/VERSION_MIN = $MIN/" OpenSankore.pro
            sed -i "s/VERSION_PATCH = .*/VERSION_PATCH = $PATCH/" OpenSankore.pro
          else
            MAJ=$(grep -m1 'VERSION_MAJ\s*=' OpenSankore.pro | sed 's/.*=\s*//' | tr -d '[:space:]')
            MIN=$(grep -m1 'VERSION_MIN\s*=' OpenSankore.pro | sed 's/.*=\s*//' | tr -d '[:space:]')
            PATCH=$(grep -m1 'VERSION_PATCH\s*=' OpenSankore.pro | sed 's/.*=\s*//' | tr -d '[:space:]')
          fi
          VERSION="${MAJ}.${MIN}.${PATCH}"
          echo "Build version: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run qmake
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          mkdir -p build/linux/release/moc build/linux/release/objects build/linux/release/rcc build/linux/release/ui build/linux/release/product
          qmake6 OpenSankore.pro CONFIG+=no_webengine

      - name: Build
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          make -j$(nproc)

      - name: Compile & deploy translations (#250)
        run: |
          # Compile .ts -> .qm next to the binary (app loads
          # <applicationDirPath>/i18n/sankore_<lang>.qm at runtime).
          export PATH="/usr/lib/qt6/bin:$PATH"
          LRELEASE=$(command -v lrelease || command -v lrelease-qt6 || echo /usr/lib/qt6/bin/lrelease)
          for ts in resources/i18n/sankore_*.ts; do
            "$LRELEASE" -silent "$ts" -qm "${ts%.ts}.qm"
          done
          mkdir -p build/linux/release/product/i18n
          cp -f resources/i18n/*.qm build/linux/release/product/i18n/
          ls -la build/linux/release/product/i18n/ | head

      - name: List build output
        if: always()
        run: |
          find build -name "Open-Sankore*" 2>/dev/null || echo "No output found"
          ls -la build/linux/release/product/ 2>/dev/null || echo "Product dir not found"

      - name: Smoke test
        run: |
          export QT_QPA_PLATFORM=offscreen
          export LANG=C.UTF-8
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          # Enable core dumps for crash analysis
          ulimit -c unlimited
          echo "core.%p" | sudo tee /proc/sys/kernel/core_pattern || true
          # A crash (non-zero exit) must fail the build. #169 fixed the
          # offscreen --quit-after hang (std::thread watchdog), so a clean
          # startup now exits 0. On crash we dump the backtrace, then
          # propagate the failure by re-exiting with the original code.
          EXIT_CODE=0
          timeout 60 build/linux/release/product/Open-Sankore --quit-after=10 --smoke-scenario || EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== SMOKE TEST CRASHED (exit $EXIT_CODE) ==="
            CORE_FILE=$(find . -name "core*" -newer build/linux/release/product/Open-Sankore 2>/dev/null | head -1)
            if [ -n "$CORE_FILE" ]; then
              echo "=== BACKTRACE ==="
              gdb -batch -ex "bt full" -ex "quit" build/linux/release/product/Open-Sankore "$CORE_FILE" 2>&1 | head -80
            else
              echo "No core file found"
            fi
            exit $EXIT_CODE
          fi
          echo "ARM64 smoke test completed"

      - name: Upload ARM64 binary
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: open-sankore-linux-arm64
          path: build/linux/release/product/
          if-no-files-found: warn

      - name: Package .deb and .rpm for ARM64
        if: success()
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          ./scripts/package-linux.sh arm64 "${{ env.APP_VERSION }}"

      - name: Upload ARM64 .deb package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: open-sankore-linux-arm64-deb
          path: build/packages/*.deb
          if-no-files-found: warn

      - name: Upload ARM64 .rpm package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: open-sankore-linux-arm64-rpm
          path: build/packages/*.rpm
          if-no-files-found: warn
