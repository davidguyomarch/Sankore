name: Build Linux x64

on:
  push:
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    container:
      image: ubuntu:22.04
      options: --user root

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            gdb \
            build-essential \
            cmake \
            python3 \
            python3-pip \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-util-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libpulse-dev \
            libzinnia-dev \
            libssl-dev \
            zlib1g-dev \
            libomp-dev \
            pkg-config \
            lcov \
            rpm \
            curl \
            file

      - name: Cache Qt 6.8.2
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: /opt/qt
          key: qt-6.8.2-linux-gcc-64-core5compat-multimedia-shadertools

      - name: Install Qt 6.8.2 via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop 6.8.2 linux_gcc_64 -m qt5compat qtmultimedia qtshadertools --outputdir /opt/qt

      - name: Set Qt environment
        run: |
          echo "/opt/qt/6.8.2/gcc_64/bin" >> $GITHUB_PATH
          echo "Qt6_DIR=/opt/qt/6.8.2/gcc_64" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/qt/6.8.2/gcc_64/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Cache QuaZip
        id: cache-quazip
        uses: actions/cache@v5
        with:
          path: /tmp/quazip-install
          key: quazip-1.4-ubuntu2204-qt6.8.2-v1

      - name: Build QuaZip from source
        if: steps.cache-quazip.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.4 https://github.com/stachenov/quazip.git /tmp/quazip-src
          cmake -S /tmp/quazip-src -B /tmp/quazip-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/qt/6.8.2/gcc_64 \
            -DCMAKE_INSTALL_PREFIX=/tmp/quazip-install \
            -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DBUILD_SHARED_LIBS=ON \
            -DQUAZIP_BZIP2=OFF
          cmake --build /tmp/quazip-build -j$(nproc)
          cmake --install /tmp/quazip-build

      - name: Install QuaZip
        run: |
          cp -a /tmp/quazip-install/lib/* /usr/local/lib/ 2>/dev/null || true
          cp -a /tmp/quazip-install/include/* /usr/local/include/ 2>/dev/null || true
          ldconfig

      - name: Generate git version header and set version
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "#define GIT_COMMIT \"$(git rev-parse --short HEAD)\"" > src/core/git_version.h
          echo "#define GIT_VERSION \"$(git describe --tags --always)\"" >> src/core/git_version.h
          # The git tag is the single source of truth. On a tag push (or dispatch
          # on a tag) GITHUB_REF_NAME is the tag name (v4.3.0), reliable under a
          # shallow clone unlike `git describe`. Fall back to .pro (dev build).
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJ="${BASH_REMATCH[1]}"; MIN="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
            echo "Updating version to $MAJ.$MIN.$PATCH from tag $REF_NAME"
            sed -i "s/VERSION_MAJ = .*/VERSION_MAJ = $MAJ/" OpenSankore.pro
            sed -i "s/VERSION_MIN = .*/VERSION_MIN = $MIN/" OpenSankore.pro
            sed -i "s/VERSION_PATCH = .*/VERSION_PATCH = $PATCH/" OpenSankore.pro
          else
            MAJ=$(grep -m1 'VERSION_MAJ\s*=' OpenSankore.pro | sed 's/.*=\s*//' | tr -d '[:space:]')
            MIN=$(grep -m1 'VERSION_MIN\s*=' OpenSankore.pro | sed 's/.*=\s*//' | tr -d '[:space:]')
            PATCH=$(grep -m1 'VERSION_PATCH\s*=' OpenSankore.pro | sed 's/.*=\s*//' | tr -d '[:space:]')
          fi
          VERSION="${MAJ}.${MIN}.${PATCH}"
          echo "Build version: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run qmake
        run: |
          mkdir -p build/linux/release/moc build/linux/release/objects build/linux/release/rcc build/linux/release/ui build/linux/release/product
          qmake OpenSankore.pro CONFIG+=no_webengine "QMAKE_CXXFLAGS+=--coverage" "QMAKE_LFLAGS+=--coverage"

      - name: Build
        run: |
          make -j$(nproc)

      - name: Compile & deploy translations (#250)
        run: |
          # Compile .ts -> .qm and place them next to the binary (the app loads
          # <applicationDirPath>/i18n/sankore_<lang>.qm at runtime).
          export PATH="/opt/qt/6.8.2/gcc_64/bin:$PATH"
          for ts in resources/i18n/sankore_*.ts; do
            lrelease -silent "$ts" -qm "${ts%.ts}.qm"
          done
          mkdir -p build/linux/release/product/i18n
          cp -f resources/i18n/*.qm build/linux/release/product/i18n/
          ls -la build/linux/release/product/i18n/ | head

      - name: List build output
        if: always()
        run: |
          find build -name "Open-Sankore*" 2>/dev/null || echo "No output found"
          ls -la build/linux/release/product/ 2>/dev/null || echo "Product dir not found"

      - name: Smoke test (app coverage)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export LANG=C.UTF-8
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          # Enable core dumps for crash analysis
          ulimit -c unlimited
          echo "core" | sudo tee /proc/sys/kernel/core_pattern || true
          # Launch app with --quit-after for clean exit (writes .gcda coverage files)
          timeout 60 build/linux/release/product/Open-Sankore --quit-after=10 --smoke-scenario || {
            EXIT_CODE=$?
            echo "=== APP CRASHED (exit code $EXIT_CODE) ==="
            # Try to get backtrace from core file
            CORE_FILE=$(find . -name "core*" -newer build/linux/release/product/Open-Sankore 2>/dev/null | head -1)
            if [ -n "$CORE_FILE" ]; then
              echo "=== BACKTRACE ==="
              gdb -batch -ex "bt full" -ex "quit" build/linux/release/product/Open-Sankore "$CORE_FILE" 2>&1 | head -100
            else
              echo "No core file found"
            fi
            echo "Continuing despite crash (coverage may be incomplete)"
          }
          echo "App smoke test completed"
          GCDA_COUNT=$(find . -name "*.gcda" 2>/dev/null | wc -l)
          echo "Found $GCDA_COUNT .gcda files"

      - name: Collect app coverage
        continue-on-error: true
        run: |
          echo "=== Searching for .gcda files ==="
          find . -name "*.gcda" -not -path "*/tests/*" 2>/dev/null | head -20
          GCDA_COUNT=$(find . -name "*.gcda" -not -path "*/tests/*" 2>/dev/null | wc -l)
          echo "Found $GCDA_COUNT app .gcda files"
          if [ "$GCDA_COUNT" -gt 0 ]; then
            lcov --capture --directory . --output-file build/app-coverage.info --no-external || true
            lcov --remove build/app-coverage.info '*/moc_*' '*/qrc_*' '*/tests/*' --output-file build/app-coverage-filtered.info || true
            echo ""
            echo "╔══════════════════════════════════════════════╗"
            echo "║    APP COVERAGE (smoke test startup only)    ║"
            echo "╚══════════════════════════════════════════════╝"
            lcov --summary build/app-coverage-filtered.info 2>&1 || true
            echo ""
          else
            echo "No .gcda files found — app coverage not available"
          fi

      - name: Build unit tests
        run: |
          cd tests
          qmake tests.pro
          # Fix: regenerate moc_predefs.h for x86_64
          g++ -pipe --coverage -O2 -std=c++20 -Wall -Wextra -fPIC -dM -E -o build/moc/moc_predefs.h /opt/qt/6.8.2/gcc_64/mkspecs/features/data/dummy.cpp
          # Patch: remove any aarch64 include paths from Makefile
          sed -i 's|-I/usr/include/aarch64-linux-gnu[^ ]*||g' Makefile 2>/dev/null || true
          sed -i 's|-I/usr/lib/gcc/aarch64-linux-gnu[^ ]*||g' Makefile 2>/dev/null || true
          # Patch: remove system C++ include paths from moc commands only
          # moc cannot parse GCC 11's <type_traits> — these paths are only needed by g++
          sed -i '/libexec\/moc/s| -I/usr/include/c++/[^ ]*||g' Makefile 2>/dev/null || true
          sed -i '/libexec\/moc/s| -I/usr/local/include||g' Makefile 2>/dev/null || true
          sed -i '/libexec\/moc/s| -I/usr/include ||g' Makefile 2>/dev/null || true
          sed -i '/libexec\/moc/s| -I/usr/include$||g' Makefile 2>/dev/null || true
          # Pre-generate moc for UBFileSystemUtils.h (moc crashes on GCC system headers
          # when --include moc_predefs.h pulls in <type_traits>). Run without moc_predefs.
          /opt/qt/6.8.2/gcc_64/libexec/moc -DQT_NO_DEBUG -DQT_WIDGETS_LIB -DQT_GUI_LIB -DQT_TESTLIB_LIB -DQT_XML_LIB -DQT_NETWORK_LIB -DQT_CORE_LIB \
            -I/opt/qt/6.8.2/gcc_64/mkspecs/linux-g++ -I. -I../src \
            -I/opt/qt/6.8.2/gcc_64/include -I/opt/qt/6.8.2/gcc_64/include/QtCore \
            -I/opt/qt/6.8.2/gcc_64/include/QtGui -I/opt/qt/6.8.2/gcc_64/include/QtWidgets \
            ../src/frameworks/UBFileSystemUtils.h -o premoc/moc_UBFileSystemUtils.cpp
          # Pre-generate moc for UBOEmbedParser.h (QObject under test for #229 regression)
          /opt/qt/6.8.2/gcc_64/libexec/moc -DQT_NO_DEBUG -DQT_WIDGETS_LIB -DQT_GUI_LIB -DQT_TESTLIB_LIB -DQT_XML_LIB -DQT_NETWORK_LIB -DQT_CORE_LIB \
            -I/opt/qt/6.8.2/gcc_64/mkspecs/linux-g++ -I. -I../src \
            -I/opt/qt/6.8.2/gcc_64/include -I/opt/qt/6.8.2/gcc_64/include/QtCore \
            -I/opt/qt/6.8.2/gcc_64/include/QtGui -I/opt/qt/6.8.2/gcc_64/include/QtWidgets \
            ../src/web/UBOEmbedParser.h -o premoc/moc_UBOEmbedParser.cpp
          make -j$(nproc)

      - name: Run unit tests with coverage
        shell: bash
        run: |
          set +e
          set +o pipefail
          cd tests
          if [ -f build/OpenSankoreTests ]; then
            export QT_QPA_PLATFORM=offscreen
            ./build/OpenSankoreTests -v2 -o -,txt -o build/test-results.xml,junitxml 2>&1 | tee build/test-results.txt
            TEST_EXIT=${PIPESTATUS[0]}
            echo ""
            echo "=== Tests exit code: $TEST_EXIT ==="
            exit $TEST_EXIT
          else
            echo "ERROR: Test binary not found"
            exit 1
          fi

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: tests/build/test-results.xml
          check_name: Linux Unit Tests
          fail_on_failure: false

      - name: Upload visual test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-images
          path: |
            tests/visual/reference/
            tests/visual/actual/
          if-no-files-found: ignore

      - name: Generate coverage report
        continue-on-error: true
        run: |
          cd tests
          # Unit test coverage — lines exercised by unit tests
          lcov --capture --directory build/objects --output-file build/test-coverage.info || true
          lcov --remove build/test-coverage.info '/usr/*' '*/moc_*' '*/premoc/*' --output-file build/test-coverage-filtered.info || true
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║       UNIT TEST COVERAGE (tests only)       ║"
          echo "╚══════════════════════════════════════════════╝"
          lcov --summary build/test-coverage-filtered.info 2>&1 || true
          echo ""
          # Merge app + test coverage if both exist
          if [ -f ../build/app-coverage-filtered.info ]; then
            lcov --add-tracefile build/test-coverage-filtered.info --add-tracefile ../build/app-coverage-filtered.info --output-file build/combined-coverage.info 2>/dev/null || cp build/test-coverage-filtered.info build/combined-coverage.info
            echo "╔══════════════════════════════════════════════╗"
            echo "║     COMBINED COVERAGE (App + Unit Tests)    ║"
            echo "╚══════════════════════════════════════════════╝"
            lcov --summary build/combined-coverage.info 2>&1 || true
          else
            cp build/test-coverage-filtered.info build/combined-coverage.info 2>/dev/null || true
          fi
          echo ""
          genhtml build/combined-coverage.info --output-directory build/coverage_html --title "Open-Sankoré Coverage" || true

      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: |
          cd tests
          # Extract metrics
          APP_LINES=$(lcov --summary ../build/app-coverage-filtered.info 2>&1 | grep 'lines' | grep -oP '[\d.]+(?=%)' || echo "N/A")
          APP_FUNCS=$(lcov --summary ../build/app-coverage-filtered.info 2>&1 | grep 'functions' | grep -oP '[\d.]+(?=%)' || echo "N/A")
          TEST_LINES=$(lcov --summary build/test-coverage-filtered.info 2>&1 | grep 'lines' | grep -oP '[\d.]+(?=%)' || echo "N/A")
          TEST_FUNCS=$(lcov --summary build/test-coverage-filtered.info 2>&1 | grep 'functions' | grep -oP '[\d.]+(?=%)' || echo "N/A")
          COMBINED_LINES=$(lcov --summary build/combined-coverage.info 2>&1 | grep 'lines' | grep -oP '[\d.]+(?=%)' || echo "N/A")
          COMBINED_FUNCS=$(lcov --summary build/combined-coverage.info 2>&1 | grep 'functions' | grep -oP '[\d.]+(?=%)' || echo "N/A")
          COMBINED_LINES_DETAIL=$(lcov --summary build/combined-coverage.info 2>&1 | grep 'lines' | grep -oP '\(\d+ of \d+' | tr -d '(' || echo "")
          # Write to job summary
          echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | App (smoke test) | Unit Tests | Combined |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------------|------------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lines | ${APP_LINES}% | ${TEST_LINES}% | **${COMBINED_LINES}%** ${COMBINED_LINES_DETAIL} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | ${APP_FUNCS}% | ${TEST_FUNCS}% | **${COMBINED_FUNCS}%** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Coverage report HTML available as artifact: \`coverage-report-linux\`" >> $GITHUB_STEP_SUMMARY

      - name: Update coverage badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          cd tests
          COV_PCT=$(lcov --summary build/combined-coverage.info 2>&1 | grep 'lines' | grep -oP '[\d.]+(?=%)' || echo "0")
          echo "Coverage: ${COV_PCT}%"
          COV_INT=${COV_PCT%.*}
          if [ "$COV_INT" -ge 80 ]; then COLOR="brightgreen"
          elif [ "$COV_INT" -ge 60 ]; then COLOR="green"
          elif [ "$COV_INT" -ge 40 ]; then COLOR="yellowgreen"
          elif [ "$COV_INT" -ge 20 ]; then COLOR="yellow"
          else COLOR="red"; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV_PCT}%\",\"color\":\"${COLOR}\"}" > /tmp/coverage.json
          cat /tmp/coverage.json
          python3 ../scripts/update_coverage_badge.py /tmp/coverage.json

      - name: Package .deb and .rpm
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          ./scripts/package-linux.sh amd64 "${{ env.APP_VERSION }}"

      - name: Upload binary artifact
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: open-sankore-linux-x64
          path: build/linux/release/product/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-linux
          path: tests/build/coverage_html/
          if-no-files-found: warn

      - name: Upload .deb package
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: open-sankore-linux-x64-deb
          path: build/packages/*.deb
          if-no-files-found: warn

      - name: Upload .rpm package
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: open-sankore-linux-x64-rpm
          path: build/packages/*.rpm
          if-no-files-found: warn

      - name: Build AppImage
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          # Create AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary
          cp build/linux/release/product/Open-Sankore AppDir/usr/bin/

          # Translations next to the binary (#250)
          mkdir -p AppDir/usr/bin/i18n
          cp -f build/linux/release/product/i18n/*.qm AppDir/usr/bin/i18n/ 2>/dev/null || true

          # Copy Qt libraries and dependencies
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Core.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Gui.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Widgets.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Svg.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6SvgWidgets.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Xml.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Network.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Multimedia.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6MultimediaWidgets.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6PrintSupport.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Core5Compat.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6Qml.so.6 AppDir/usr/lib/
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6OpenGL.so.6 AppDir/usr/lib/ 2>/dev/null || true
          cp /opt/qt/6.8.2/gcc_64/lib/libQt6DBus.so.6 AppDir/usr/lib/ 2>/dev/null || true
          cp /usr/local/lib/libquazip1-qt6.so* AppDir/usr/lib/ 2>/dev/null || true

          # Copy Qt plugins
          mkdir -p AppDir/usr/plugins/platforms AppDir/usr/plugins/imageformats
          cp /opt/qt/6.8.2/gcc_64/plugins/platforms/libqxcb.so AppDir/usr/plugins/platforms/ 2>/dev/null || true
          cp /opt/qt/6.8.2/gcc_64/plugins/platforms/libqoffscreen.so AppDir/usr/plugins/platforms/ 2>/dev/null || true
          cp /opt/qt/6.8.2/gcc_64/plugins/imageformats/*.so AppDir/usr/plugins/imageformats/ 2>/dev/null || true

          # Create .desktop file
          cat > AppDir/usr/share/applications/open-sankore.desktop << 'EOF'
          [Desktop Entry]
          Name=Open-Sankoré
          Comment=Interactive whiteboard application
          Exec=Open-Sankore
          Icon=open-sankore
          Terminal=false
          Type=Application
          Categories=Education;
          EOF
          cp AppDir/usr/share/applications/open-sankore.desktop AppDir/

          # Create icon
          if [ -f resources/images/sankore-icon.png ]; then
            cp resources/images/sankore-icon.png AppDir/usr/share/icons/hicolor/256x256/apps/open-sankore.png
            cp resources/images/sankore-icon.png AppDir/open-sankore.png
          else
            # Generate a simple placeholder icon
            convert -size 256x256 xc:blue -fill white -gravity center -pointsize 48 -annotate 0 "S" AppDir/open-sankore.png 2>/dev/null || touch AppDir/open-sankore.png
          fi

          # Create AppRun
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="${HERE}/usr/plugins"
          exec "${HERE}/usr/bin/Open-Sankore" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # Download appimagetool
          python3 -c "
          import urllib.request
          urllib.request.urlretrieve('https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage', 'appimagetool')
          "
          chmod +x appimagetool

          # Build AppImage (--appimage-extract-and-run for container compatibility)
          ./appimagetool --appimage-extract-and-run AppDir Open-Sankore-x86_64.AppImage

          ls -la *.AppImage 2>/dev/null || echo "No AppImage produced"

          # Verify AppImage was created
          if [ ! -f Open-Sankore-x86_64.AppImage ]; then
            echo "ERROR: AppImage not found after build"
            exit 1
          fi

      - name: Upload AppImage
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: open-sankore-linux-x64-appimage
          path: Open-Sankore-x86_64.AppImage
          if-no-files-found: warn
