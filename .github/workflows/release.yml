name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout (for gh CLI context)
        uses: actions/checkout@v7

      - name: Build release artifacts on the tag
        id: find-runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_REF="${{ github.ref_name }}"
          echo "Building release artifacts on tag $TAG_REF"

          # Always build ON THE TAG. The build workflows derive the version from
          # GITHUB_REF_NAME (the tag), so building on the tag is what guarantees
          # the artifacts (.deb/.rpm/.exe metadata) carry the release version.
          # We deliberately do NOT reuse branch/PR/master builds: those ran with
          # a non-tag ref and would embed the 0.0.0-dev fallback version.
          #
          # The three builds are dispatched FIRST (concurrently), then waited on,
          # so the total time is roughly the longest single build (~33 min)
          # rather than their sum (~75 min).

          workflows=("build-windows.yml" "build-linux.yml" "build-linux-arm64.yml")
          var_names=("win_run" "linux_run" "arm64_run")

          # Last existing run id per workflow, so we can tell the newly triggered
          # run apart from an older one on the same tag.
          declare -A prev_id
          for wf in "${workflows[@]}"; do
            prev_id[$wf]=$(gh run list --workflow="$wf" --branch "$TAG_REF" --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
          done

          # 1) Dispatch all three (non-blocking).
          for wf in "${workflows[@]}"; do
            echo "$wf: dispatching on $TAG_REF..."
            gh workflow run "$wf" --ref "$TAG_REF"
          done

          # 2) Resolve each newly triggered run id (must differ from prev_id).
          declare -A run_id
          for wf in "${workflows[@]}"; do
            rid=""
            for i in $(seq 1 24); do
              sleep 5
              rid=$(gh run list --workflow="$wf" --branch "$TAG_REF" --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
              if [ -n "$rid" ] && [ "$rid" != "${prev_id[$wf]}" ]; then
                break
              fi
              rid=""
            done
            run_id[$wf]="$rid"
            [ -n "$rid" ] && echo "$wf: triggered run $rid" || echo "$wf: could not find triggered run"
          done

          # 3) Wait on all three concurrently, then record each conclusion.
          for wf in "${workflows[@]}"; do
            [ -n "${run_id[$wf]}" ] && gh run watch "${run_id[$wf]}" --exit-status >/dev/null 2>&1 &
          done
          wait

          # 4) Publish the run id per workflow, but only if it succeeded.
          for idx in "${!workflows[@]}"; do
            wf="${workflows[$idx]}"
            var="${var_names[$idx]}"
            rid="${run_id[$wf]}"
            if [ -n "$rid" ]; then
              status=$(gh run view "$rid" --json conclusion -q '.conclusion')
              if [ "$status" = "success" ]; then
                echo "$wf: run $rid succeeded"
                echo "${var}=$rid" >> $GITHUB_OUTPUT
              else
                echo "$wf: run $rid finished with status=$status"
                echo "${var}=" >> $GITHUB_OUTPUT
              fi
            else
              echo "${var}=" >> $GITHUB_OUTPUT
            fi
          done

      - name: Download Windows artifacts
        if: steps.find-runs.outputs.win_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/windows
          gh run download ${{ steps.find-runs.outputs.win_run }} -n open-sankore-windows-x64 -D artifacts/windows/app || true
          gh run download ${{ steps.find-runs.outputs.win_run }} -n open-sankore-windows-x64-installer -D artifacts/windows/installer || true

      - name: Download Linux x64 artifacts
        if: steps.find-runs.outputs.linux_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/linux
          gh run download ${{ steps.find-runs.outputs.linux_run }} -n open-sankore-linux-x64-deb -D artifacts/linux || true
          gh run download ${{ steps.find-runs.outputs.linux_run }} -n open-sankore-linux-x64-rpm -D artifacts/linux || true

      - name: Download Linux ARM64 artifacts
        if: steps.find-runs.outputs.arm64_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/arm64
          gh run download ${{ steps.find-runs.outputs.arm64_run }} -n open-sankore-linux-arm64 -D artifacts/arm64 || true
          gh run download ${{ steps.find-runs.outputs.arm64_run }} -n open-sankore-linux-arm64-deb -D artifacts/arm64-pkg || true
          gh run download ${{ steps.find-runs.outputs.arm64_run }} -n open-sankore-linux-arm64-rpm -D artifacts/arm64-pkg || true

      - name: Package Windows zip
        if: steps.find-runs.outputs.win_run != ''
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -d artifacts/windows/app ]; then
            cd artifacts/windows/app
            zip -r "../../../Open-Sankore-${VERSION}-windows-x64.zip" .
            cd ../../..
          fi

      - name: Package Linux ARM64 tarball
        if: steps.find-runs.outputs.arm64_run != ''
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -d artifacts/arm64 ]; then
            tar czf "Open-Sankore-${VERSION}-linux-arm64.tar.gz" -C artifacts/arm64 .
          fi

      - name: Stamp version and validate SBOM
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # The tag is the single source of truth: stamp it into OpenSankore.pro
          # and sbom.spdx.json (in the runner checkout only — never committed),
          # then validate. The repo carries a 0.0.0-dev fallback between releases.
          python3 scripts/check-sbom.py --set-version "$VERSION"
          cp sbom.spdx.json "Open-Sankore-${VERSION}-sbom.spdx.json"

      - name: List release assets
        run: |
          echo "=== Release assets ==="
          find . -maxdepth 1 -name "Open-Sankore-*" -type f
          find artifacts -type f -name "*.deb" -o -name "*.rpm" -o -name "*.exe" 2>/dev/null | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            Open-Sankore-*-windows-x64.zip
            artifacts/windows/installer/*.exe
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/arm64-pkg/*.deb
            artifacts/arm64-pkg/*.rpm
            Open-Sankore-*-linux-arm64.tar.gz
            Open-Sankore-*-sbom.spdx.json
