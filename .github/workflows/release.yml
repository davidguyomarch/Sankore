name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout (for gh CLI context)
        uses: actions/checkout@v7

      - name: Find or trigger builds
        id: find-runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          TAG_REF="${{ github.ref_name }}"
          echo "Looking for build artifacts on commit $COMMIT_SHA (tag $TAG_REF)"

          find_or_trigger() {
            local workflow="$1"
            local var_name="$2"

            # Look for existing successful run on this commit
            local run_id
            run_id=$(gh run list --workflow="$workflow" --commit "$COMMIT_SHA" --status success --limit 1 --json databaseId -q '.[0].databaseId')

            if [ -n "$run_id" ]; then
              echo "$workflow: found existing run $run_id"
              echo "${var_name}=$run_id" >> $GITHUB_OUTPUT
              return
            fi

            # No existing run — trigger one and wait
            echo "$workflow: no existing build found, triggering on $TAG_REF..."
            gh workflow run "$workflow" --ref "$TAG_REF"

            # Wait for the run to appear (up to 60s)
            for i in $(seq 1 12); do
              sleep 5
              run_id=$(gh run list --workflow="$workflow" --branch "$TAG_REF" --limit 1 --json databaseId,status -q '.[0].databaseId')
              if [ -n "$run_id" ]; then
                echo "$workflow: triggered run $run_id, waiting for completion..."
                gh run watch "$run_id" --exit-status || true
                # Re-fetch to confirm success
                local status
                status=$(gh run view "$run_id" --json conclusion -q '.conclusion')
                if [ "$status" = "success" ]; then
                  echo "${var_name}=$run_id" >> $GITHUB_OUTPUT
                else
                  echo "$workflow: run $run_id finished with status=$status"
                  echo "${var_name}=" >> $GITHUB_OUTPUT
                fi
                return
              fi
            done

            echo "$workflow: could not find triggered run"
            echo "${var_name}=" >> $GITHUB_OUTPUT
          }

          find_or_trigger "build-windows.yml" "win_run"
          find_or_trigger "build-linux.yml" "linux_run"
          find_or_trigger "build-linux-arm64.yml" "arm64_run"

      - name: Download Windows artifacts
        if: steps.find-runs.outputs.win_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/windows
          gh run download ${{ steps.find-runs.outputs.win_run }} -n open-sankore-windows-x64 -D artifacts/windows/app || true
          gh run download ${{ steps.find-runs.outputs.win_run }} -n open-sankore-windows-x64-installer -D artifacts/windows/installer || true

      - name: Download Linux x64 artifacts
        if: steps.find-runs.outputs.linux_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/linux
          gh run download ${{ steps.find-runs.outputs.linux_run }} -n open-sankore-linux-x64-deb -D artifacts/linux || true
          gh run download ${{ steps.find-runs.outputs.linux_run }} -n open-sankore-linux-x64-rpm -D artifacts/linux || true

      - name: Download Linux ARM64 artifacts
        if: steps.find-runs.outputs.arm64_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/arm64
          gh run download ${{ steps.find-runs.outputs.arm64_run }} -n open-sankore-linux-arm64 -D artifacts/arm64 || true
          gh run download ${{ steps.find-runs.outputs.arm64_run }} -n open-sankore-linux-arm64-deb -D artifacts/arm64-pkg || true
          gh run download ${{ steps.find-runs.outputs.arm64_run }} -n open-sankore-linux-arm64-rpm -D artifacts/arm64-pkg || true

      - name: Package Windows zip
        if: steps.find-runs.outputs.win_run != ''
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -d artifacts/windows/app ]; then
            cd artifacts/windows/app
            zip -r "../../../Open-Sankore-${VERSION}-windows-x64.zip" .
            cd ../../..
          fi

      - name: Package Linux ARM64 tarball
        if: steps.find-runs.outputs.arm64_run != ''
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -d artifacts/arm64 ]; then
            tar czf "Open-Sankore-${VERSION}-linux-arm64.tar.gz" -C artifacts/arm64 .
          fi

      - name: Validate and stage SBOM
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          python3 scripts/check-sbom.py
          cp sbom.spdx.json "Open-Sankore-${VERSION}-sbom.spdx.json"

      - name: List release assets
        run: |
          echo "=== Release assets ==="
          find . -maxdepth 1 -name "Open-Sankore-*" -type f
          find artifacts -type f -name "*.deb" -o -name "*.rpm" -o -name "*.exe" 2>/dev/null | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            Open-Sankore-*-windows-x64.zip
            artifacts/windows/installer/*.exe
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/arm64-pkg/*.deb
            artifacts/arm64-pkg/*.rpm
            Open-Sankore-*-linux-arm64.tar.gz
            Open-Sankore-*-sbom.spdx.json
